<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Banner animado</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <main class="restaurant">
    <nav class="nombre">
      <button class="vampiro" id="btnVampiro">I eat blood</button>
      <h1 class="reset" id="reset">Rh21</h1>
      <button class="angel" id="btnAngel">I eat souls</button>
    </nav>

    <section class="creatures">
      <div class="vampiros" id="vampiros">
        <div class="tituloVampi" id="tituloVampi"></div>

        <div class="bebidasVampiros" id="bebidasVampiros"></div>

        <div class="pedidoVampiros pedido" id="pedidoVampiros"></div>
      </div>


      <div class="angels" id="angels">
        <div class="tituloAngel" id="tituloAngel"></div>

        <div class="bebidasAngeles" id="bebidasAngeles"></div>

        <div class="pedidoAngels pedido" id="pedidoAngels"></div>
      </div>
    </section>


    <section class="ocultar">
      <h2>Datos del pedido</h2>
      <form id="formularioPedido">
        <div>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Tu nombre">
          <small id="mensajeNombre"></small>
        </div>

        <div>
          <label for="modalidad">Modalidad</label>
          <select name="" id="modalidad">
          <option value="">Donde te lo bebes?</option>
          <option value="llevar">Para llevar</option>
          <option value="local">Tomar aqui</option> 
          </select>
        </div>

        <div>
          <label for="comentario"></label>
          <textarea id="comentario" maxlength="100" placeholder="Comentarios aqui"></textarea>
          <small id="contadorCaracteres">0</small>
        </div>

        <button type="submit">Confirmar datos</button>
      </form>

      <p id="resultadoFormulario"></p>
    </section>
  </main>

<!-- Contenedor principal de la ventana modal emergente oculto por defecto -->
<div id="modalPedido" class="modal ocultar">
  <!-- Caja interna con el mensaje y el botón de cierre -->
  <div class="modal-contenido">
    <!-- Título principal de agradecimiento del modal -->
    <h3>Gracias por comprar en Rh21.</h3>
    <!-- Mensaje secundario para confirmar el proceso sin repetir el título -->
    <p>Tu pedido ha sido procesado con éxito.</p>
    <!-- Botón para cerrar la ventana emergente -->
    <button id="btnCerrarModal">Cerrar</button>
  </div>
</div>

  <script src="restaurante.js"></script>
</body>

</html>
