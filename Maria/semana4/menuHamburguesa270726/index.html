<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
  <title>Efectos molones</title>
</head>

<body>
  <div class="navbar">

    <!-- logo y manu hamburguesa de font awesome-->
    <div class="contenedor">
      <a href="#" class="logo">Logo molón</a>
      <i id="burger" class="fa-solid fa-bars"></i>
    </div>

    <nav>
      <!-- Navegacion y X para cerrar de fontawesome -->
      <i id="salir" class="fa-solid fa-xmark"></i>
      <ul>
        <li><a href="#">Uno</a></li>
        <li><a href="#">Dos</a></li>
        <li><a href="#">Tres</a></li>
      </ul>
    </nav>
  </div>

  <div class="botonera">
    <div class="card w-75"  style="width: 18rem;">
      <div class="card-body">
        <h5 class="card-title">Animaciones con cambio de clase</h5>
        <div class="cajaAnimada"></div>
        <div class="botones">
          <button type="button" class="btn btn-danger" id="btnEscalar">Escalar</button>
          <button type="button" class="btn btn-danger" id="btnRotar">Rotar</button>
          <button type="button" class="btn btn-danger" id="btnOpacidad">Opacidad</button>
          <button type="button" class="btn btn-danger" id="btnRedondear">Redondear</button>
          <button type="button" class="btn btn-danger" id="btnCombo">Combo</button>
          <button type="button" class="btn btn-danger" id="btnReset">Reset</button>
        </div>
      </div>
    </div>
  </div>




  <!-- Font awesome -->
  <script src="https://kit.fontawesome.com/4ea3b805de.js" crossorigin="anonymous"></script>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <!-- Mi script -->
  <script src="scripts.js"></script>
</body>

</html>
